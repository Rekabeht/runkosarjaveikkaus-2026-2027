name: Päivitä Liiga-sarjataulukko

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Hae repository
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Päivitä sarjataulukko
        run: python scripts/update_standings.py

      - name: Päivitä Jokerien otteluohjelma
        run: python scripts/update_jokerit.py

      - name: Tallenna muuttunut data
        run: |
          if git diff --quiet -- data/standings.json data/jokerit.json && [ -f data/jokerit.json ]; then
            echo "Ei muutoksia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json data/jokerit.json
          git commit -m "Päivitä Liiga-data"
          git push
